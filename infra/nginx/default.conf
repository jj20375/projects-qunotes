# 後台靜態檔與 API 同一個 origin：refresh token cookie（SameSite=Strict、Path=/api/auth）才會被瀏覽器帶上，也不需要 CORS。
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 20m;

    # file-server 回呼 API 的內部端點只允許 compose 內網，對外一律 404。
    location /api/internal/ {
        return 404;
    }

    location /files/ {
        proxy_pass http://file-server:5190;
        proxy_request_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 圖像識別匯入會等 Claude 回應（API 端最多 150 秒、重試 1 次），預設 60 秒會先逾時。
    location = /api/quote-imports {
        proxy_pass http://api:8080;
        proxy_read_timeout 330s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Astro static 以 /admin/users/index.html 形式輸出頁面。
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
