# 專案報價管理系統 compose stack（不含 MariaDB）
#
# MariaDB 沿用主機上的共用 container（美達特的 shared-db／central-mariadb），
# 必須疊上 docker-compose.shared-db.yml 才能連到資料庫，所以不要直接下 docker compose：
#   部署：./deploy/deploy.sh --environment=<development|demo|production>
#   維運：./deploy/dc.sh ps | logs -f api（自動帶上 overlay 與 deploy/.env）
# 各環境差異放在 deploy/.env.<環境>；流程見 deploy/DEPLOY-FLOW.md。
#
# 檔案本體由 file-server 存在 MinIO（獨立 bucket 與帳號，不與美達特共用）。
name: quote-platform

# Docker 預設的 json-file 日誌不會輪替，demo／正式機長期跑會把磁碟塞滿。
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  api:
    build:
      context: .
      dockerfile: apps/api/QuotePlatform.Api/Dockerfile
    image: quote-platform-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    logging: *default-logging
    environment:
      ASPNETCORE_URLS: http://0.0.0.0:8080
      # 連線目標 mariadb 是共用 MariaDB 在外部 network 上的名稱（見 docker-compose.shared-db.yml）。
      ConnectionStrings__Quote: Server=mariadb;Port=3306;Database=quote_platform;User=quote_app;Password=${DB_PASSWORD:?請在 deploy/.env 設定 DB_PASSWORD}
      Quote__JwtKey: ${JWT_KEY:?請在 deploy/.env 設定 JWT_KEY}
      Quote__RefreshCookieSecure: ${REFRESH_COOKIE_SECURE:-true}
      # 掛在子路徑下時，refresh cookie 的 Path 要帶前綴；與 web-build 的 QUOTE_BASE_PATH 同一個來源。
      Quote__PublicBasePath: ${APP_BASE_PATH:-}
      Quote__LoginCaptchaEnabled: "true"
      # 預設不自動套用 schema：重啟容器不該悄悄改資料庫。需要時用 deploy.sh --migrate 單次開啟。
      Quote__MigrateOnStart: ${MIGRATE_ON_START:-false}
      Quote__BootstrapOnStart: ${BOOTSTRAP_ON_START:-false}
      Quote__BootstrapAdminPassword: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      Quote__SeedDemoData: "false"
      Quote__FileTokenKey: ${FILE_TOKEN_KEY:?請在 deploy/.env 設定 FILE_TOKEN_KEY}
      Quote__FileCallbackSecret: ${FILE_CALLBACK_SECRET:?請在 deploy/.env 設定 FILE_CALLBACK_SECRET}
      Quote__FilePublicBasePath: /files
      # 報價單 PDF 的公司 Logo 由 API 走內網向 file-server 取檔（不經 nginx）。
      Quote__FileServerInternalUrl: http://file-server:5190
      Quote__AnthropicApiKey: ${ANTHROPIC_API_KEY:-}
      Quote__GeminiApiKey: ${GEMINI_API_KEY:-}
      # AI 供應商、模型、強度在 deploy/config/ai-settings.json；改檔後幾秒內生效，不需重啟。
      # 掛整個資料夾（不是單一檔案），編輯器以「另存取代」方式存檔時容器內也看得到新內容；Docker 掛載需用輪詢偵測變更。
      Quote__AiSettingsPath: /app/config/ai-settings.json
      DOTNET_USE_POLLING_FILE_WATCHER: "true"
    volumes:
      - ./deploy/config:/app/config:ro
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  file-server:
    build:
      context: .
      dockerfile: file-server/Dockerfile
    image: quote-platform-file-server:${IMAGE_TAG:-latest}
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      - minio
    environment:
      FILE_TOKEN_KEY: ${FILE_TOKEN_KEY}
      FILE_CALLBACK_SECRET: ${FILE_CALLBACK_SECRET}
      # compose 內網直接呼叫 API；nginx 對外封鎖 /api/internal/。
      FILE_CALLBACK_URL: http://api:8080/api/internal/files
      STORAGE_DRIVER: s3
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: quote-files
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:?請在 deploy/.env 設定 MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?請在 deploy/.env 設定 MINIO_ROOT_PASSWORD}
    volumes:
      - file-tmp:/data
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  minio:
    image: minio/minio:${MINIO_TAG:-RELEASE.2025-09-07T16-13-09Z}
    restart: unless-stopped
    logging: *default-logging
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  # 前端建置工具：deploy.sh 每次部署執行一次，依 APP_BASE_PATH 產生靜態檔到 web-dist 後結束。
  # 放在 tools profile，`up` 不會啟動它；前綴在目標機決定，同一份映像可用在任何環境。
  web-build:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: quote-platform-web-build:${IMAGE_TAG:-latest}
    profiles: ["tools"]
    logging: *default-logging
    environment:
      # 必須與 api 的 Quote__PublicBasePath 是同一個值，所以兩邊都只讀 APP_BASE_PATH。
      QUOTE_BASE_PATH: ${APP_BASE_PATH:-}
    volumes:
      - web-dist:/out

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      - api
      - file-server
    environment:
      # 官方 entrypoint 把 templates/*.template 代入環境變數後輸出到 conf.d/；只允許代換這一個，
      # 其他 $ 開頭的都是 nginx 自己的變數。
      NGINX_ENVSUBST_FILTER: TRUSTED_PROXY_CIDR
      # 只有從這個網段連進來的請求，才採信它帶的 X-Forwarded-For 作為使用者 IP（見 infra/nginx/default.conf.template）。
      TRUSTED_PROXY_CIDR: ${TRUSTED_PROXY_CIDR:-127.0.0.1/32}
    volumes:
      - ./infra/nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - web-dist:/usr/share/nginx/html:ro
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8096}:80"
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

  # 只供本機／測試機驗證子路徑部署：模擬 IIS 把 APP_BASE_PATH 剝掉後轉給 web，不必真的有 IIS 也能完整瀏覽。
  # APP_BASE_PATH 留空時不要啟動（location 會是空字串，nginx 起不來；沒有前綴直接開 WEB_PORT 即可）。
  #   ./deploy/dc.sh --profile dev-proxy up -d dev-proxy
  #   開啟 http://127.0.0.1:${DEV_PROXY_PORT}${APP_BASE_PATH}/
  dev-proxy:
    image: nginx:1.27-alpine
    profiles: ["dev-proxy"]
    logging: *default-logging
    depends_on:
      - web
    environment:
      NGINX_ENVSUBST_FILTER: APP_BASE_PATH
      APP_BASE_PATH: ${APP_BASE_PATH:-}
    volumes:
      - ./infra/nginx/dev-outer-proxy.conf.template:/etc/nginx/templates/default.conf.template:ro
    ports:
      - "127.0.0.1:${DEV_PROXY_PORT:-8097}:80"

volumes:
  minio-data:
  # 上傳中的暫存檔，存完即刪，不需備份。
  file-tmp:
  # web-build 產生的前端靜態檔；每次部署重新產生，不需備份。
  web-dist:
